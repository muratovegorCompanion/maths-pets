<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF8A5B">
  <title>Maths Pets</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"></main>
  <script type="module" src="js/app.js"></script>
  <script>
    // If a file of the game failed to download (a Wi-Fi blip on the very first visit), the game never starts
    // and the screen stays blank. Offer a button instead. If the game starts late, it replaces this.
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app.children.length) return;
      app.innerHTML = '<div class="oops"><div class="oops-pet">🐾</div><p>Oops! The game didn\'t load.</p>' +
        '<button class="btn primary big" onclick="location.reload()">Tap to try again</button></div>';
    }, 6000);
  </script>
</body>
</html>
